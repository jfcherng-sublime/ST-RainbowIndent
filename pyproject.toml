[project]
name = "RainbowIndent"
version = "0.0.0"
description = "Makes indentation easier to read."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "more-itertools>=11,<12",
]

[dependency-groups]
dev = [
  "mypy>=2",
  "pytest>=8",
  "ruff>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]

[tool.mypy]
# ignore_missing_imports = False
check_untyped_defs = true
strict_optional = true
mypy_path = 'typings:stubs'
python_version = '3.14'

[[tool.mypy.overrides]]
module = ["plugin.libs.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pyright]
include = ['./']
exclude = [
  '**/__pycache__/',
  '**/node_modules/',
  # git-related
  '**/.git/',
  '**/br-*/',
  '**/branch-*/',
]
ignore = ['**/.venv', '**/libs']
stubPath = 'typings'
pythonVersion = '3.14'

[tool.ruff]
preview = true
line-length = 120
target-version = 'py314'
exclude = [
  "*/libs/*",
  ".*_cache",
  ".git",
  ".venv",
  ".venv-*",
  "branch-*",
  "stubs",
  "tests/files",
  "typings",
  "vendor",
  "venv",
  "venv-*",
]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "FURB",
  "I",
  "PERF",
  "PIE",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "class-as-data-structure",  # test stubs may not be dataclasses
  "whitespace-before-punctuation",
  "non-empty-init-module",  # ST plugins need plugin_loaded/unloaded in __init__.py
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"boot.py" = ["module-import-not-at-top-of-file"]
